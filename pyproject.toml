[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "tree-pipeline"
version = "1.0.0"
description = "Tree-parallel development pipeline with contract-first DAG orchestration"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xwj"}]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
